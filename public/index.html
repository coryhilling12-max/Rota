const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  lock:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,

const KIND_ICON = { day: ICONS.sun, night: ICONS.moon, hol: ICONS.suitcase, note: ICONS.book };

const todayISO = new Date().toLocaleDateString("en-CA"); // yyyy-mm-dd local
function fmt(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function range(a){ const s=fmt(a), e=fmt(a); e.setDate(e.getDate()+6);
  const mo=x=>x.toLocaleDateString("en-GB",{month:"short"});
  return `${s.getDate()} ${mo(s)} – ${e.getDate()} ${mo(e)}`; }

function weekCard(w){
  const end = fmt(w.weekStart); end.setDate(end.getDate()+6);
  const isCurrent = todayISO >= w.weekStart && todayISO <= end.toLocaleDateString("en-CA");
  const cells = w.days.map(d=>{
    const isToday = d.date === todayISO;
    const dayNum = fmt(d.date).getDate();
    const idx = w.days.indexOf(d);
    if (d.kind === "off"){
      return `<div class="bg-white px-2 pt-2 pb-3 min-h-[92px] flex flex-col ${isToday?'bg-sage-50/60':''}">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-semibold uppercase text-stone-400">${DAYS[idx]}</span>
          <span class="text-xs w-5 h-5 flex items-center justify-center rounded-full ${isToday?'bg-stone-900 text-white font-semibold':'text-stone-500'}">${dayNum}</span>
        </div><div class="flex-1 flex items-center"><span class="text-[11px] text-stone-300">off</span></div></div>`;
    }
    return `<div class="bg-white px-2 pt-2 pb-3 min-h-[92px] flex flex-col ${isToday?'bg-sage-50/60':''}">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] font-semibold uppercase text-stone-400">${DAYS[idx]}</span>
        <span class="text-xs w-5 h-5 flex items-center justify-center rounded-full ${isToday?'bg-stone-900 text-white font-semibold':'text-stone-500'}">${dayNum}</span>
      </div>
      <div class="flex-1 rounded-xl px-1.5 py-1 text-[11px] leading-snug font-semibold flex flex-col items-center justify-center text-center ${CHIP[d.kind]}">
        <div>${d.label}</div>
        ${d.category ? `<div class="text-[9px] font-normal opacity-70 mt-0.5">${d.category}</div>` : ''}
      </div></div>`;
  }).join("");

  return `<div class="rounded-2xl border bg-white shadow-sm overflow-hidden transition-shadow hover:shadow-md ${isCurrent?'border-sage-300 ring-1 ring-sage-300':'border-stone-200'}">
    <div class="flex items-center justify-between px-5 py-3.5">
      <div class="flex items-center gap-3">
        ${isCurrent?'<span class="text-[10px] font-semibold uppercase tracking-wide bg-sage-600 text-white px-2 py-0.5 rounded-full">This week</span>':''}
        <div><div class="font-semibold text-stone-900">${range(w.weekStart)}</div>
        <div class="text-xs text-stone-400">${[w.cycle, roleLabel(w.role)].filter(Boolean).join(" · ")}</div></div>
      </div>
      <div class="text-right">
        <div class="text-sm font-medium text-stone-700">${w.worked>0?w.worked+'h':'—'}</div>
        ${w.leave>0?`<div class="text-[11px] text-emerald-600">${w.leave}h leave</div>`:''}
      </div>
    </div>
    <div class="grid grid-cols-7 gap-px bg-stone-100 border-t border-stone-100">${cells}</div>
  </div>`;
}

// ---- pay ----
const HOURLY_RATE = 13.50;
const CONTRACT_HOURS_PER_WEEK = 40;
const CONTRACT_HOURS_PER_PERIOD = CONTRACT_HOURS_PER_WEEK * 4; // every pay period is exactly 4 weeks

// Last payday was 17 Jul 2026, cutoff a week before that (10 Jul). Pay runs every 28 days from there,
// each new period starting the day after the previous cutoff.
const ANCHOR_CUTOFF = new Date(2026, 6, 10);
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function blockIndexFor(date){
  const diffDays = Math.round((date - ANCHOR_CUTOFF) / 86400000);
  return Math.max(1, Math.ceil(diffDays / 28));
}
function payPeriod(blockIndex){
  const end = addDays(ANCHOR_CUTOFF, 28*blockIndex);
  const start = addDays(end, -27);
  const payday = addDays(end, 7);
  return { start, end, payday };
}

// Rough UK PAYE estimate: standard 1257L tax code, no student loan, paid every 4 weeks (13 periods/year).
function ukPeriodTaxAndNI(grossPeriod){
  const PA = 12570/13, BASIC_TOP = 50270/13, HIGHER_TOP = 125140/13;
  let tax = 0;
  if (grossPeriod > PA) tax += (Math.min(grossPeriod, BASIC_TOP) - PA) * 0.20;
  if (grossPeriod > BASIC_TOP) tax += (Math.min(grossPeriod, HIGHER_TOP) - BASIC_TOP) * 0.40;
  if (grossPeriod > HIGHER_TOP) tax += (grossPeriod - HIGHER_TOP) * 0.45;
  const NI_PT = 242*4, NI_UEL = 967*4; // weekly thresholds x4 weeks
  let ni = 0;
  if (grossPeriod > NI_PT) ni += (Math.min(grossPeriod, NI_UEL) - NI_PT) * 0.08;
  if (grossPeriod > NI_UEL) ni += (grossPeriod - NI_UEL) * 0.02;
  return { tax, ni, net: grossPeriod - tax - ni };
}

// Days with no rota entry at all yet (not even "off") get an estimate at the
// contracted daily rate, so a pay period isn't understated just because next
// month's rota hasn't been published.
function payBracketCard(start, end, payday, allDays, knownDates, isCurrent){
  const startISO = start.toLocaleDateString("en-CA"), endISO = end.toLocaleDateString("en-CA");
  let workedHours = 0, leaveHours = 0;
  for (const d of allDays){
    if (d.date < startISO || d.date > endISO) continue;
    if (d.kind === "day" || d.kind === "night" || d.kind === "note") workedHours += d.hours; // "note" covers paid college days
    else if (d.kind === "hol") leaveHours += d.hours;
  }

  let missingDays = 0;
  for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate()+1)){
    if (!knownDates.has(cursor.toLocaleDateString("en-CA"))) missingDays++;
  }
  const estimatedHours = Math.round(missingDays * (CONTRACT_HOURS_PER_WEEK/7) * 100) / 100;

  const totalHours = workedHours + leaveHours + estimatedHours;
  const gross = totalHours * HOURLY_RATE;
  const { tax, ni, net } = ukPeriodTaxAndNI(gross);
  const mo = x => x.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const money = x => `£${x.toFixed(2)}`;

  return `<div class="rounded-2xl border bg-white shadow-sm px-5 py-4 transition-shadow hover:shadow-md ${isCurrent?'border-sage-300 ring-1 ring-sage-300':'border-stone-200'}">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        ${isCurrent?'<span class="text-[10px] font-semibold uppercase tracking-wide bg-sage-600 text-white px-2 py-0.5 rounded-full">Current</span>':'<span class="text-[10px] font-semibold uppercase tracking-wide bg-stone-100 text-stone-400 px-2 py-0.5 rounded-full">Upcoming</span>'}
        <div class="text-sm font-semibold text-stone-900">${mo(start)} – ${mo(end)}</div>
      </div>
      <div class="text-xs text-stone-400">Paid ${mo(payday)}</div>
    </div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div><div class="text-lg font-bold text-stone-900">${totalHours.toFixed(1)}h</div><div class="flex items-center justify-center gap-1 text-[11px] text-stone-400"><span class="w-3 h-3">${ICONS.clock}</span>Total hours${leaveHours>0?` (${leaveHours.toFixed(1)}h leave)`:''}</div></div>
      <div><div class="text-lg font-bold text-stone-900">${money(gross)}</div><div class="flex items-center justify-center gap-1 text-[11px] text-stone-400"><span class="w-3 h-3">${ICONS.banknote}</span>Gross pay</div></div>
      <div><div class="text-lg font-bold text-rose-500">-${money(tax+ni)}</div><div class="flex items-center justify-center gap-1 text-[11px] text-stone-400"><span class="w-3 h-3">${ICONS.receipt}</span>Est. tax + NI</div></div>
      <div><div class="text-lg font-bold text-emerald-600">${money(net)}</div><div class="flex items-center justify-center gap-1 text-[11px] text-stone-400"><span class="w-3 h-3">${ICONS.wallet}</span>Est. take-home</div></div>
    </div>
    <div class="mt-3 pt-3 border-t border-stone-100 text-[11px] text-stone-400 flex items-center justify-between">
      <span>vs ${CONTRACT_HOURS_PER_PERIOD}h contracted (${CONTRACT_HOURS_PER_WEEK}h × 4wks)</span>
      <span class="font-medium ${totalHours>=CONTRACT_HOURS_PER_PERIOD?'text-emerald-600':'text-amber-600'}">${totalHours>=CONTRACT_HOURS_PER_PERIOD?'+':''}${(totalHours-CONTRACT_HOURS_PER_PERIOD).toFixed(1)}h</span>
    </div>
    ${estimatedHours>0?`<div class="mt-1.5 text-[11px] text-sage-500">Includes ~${estimatedHours.toFixed(1)}h estimated (rota not published for ${missingDays} day${missingDays===1?'':'s'} yet)</div>`:''}
  </div>`;
}

// archiveDays covers weeks that already rolled off the live rota but still fall
// inside a pay period being shown — included in totals here, never rendered below.
function payCards(weeks, archiveDays){
  const allDays = weeks.flatMap(w => w.days).concat(archiveDays);
  if (!allDays.length) return "";
  const knownDates = new Set(allDays.map(d => d.date));
  const minDate = fmt(allDays.reduce((a,b)=>a.date<b.date?a:b).date);
  const maxDate = fmt(allDays.reduce((a,b)=>a.date>b.date?a:b).date);
  const startBlock = blockIndexFor(minDate);
  const endBlock = blockIndexFor(maxDate);
  const currentBlock = blockIndexFor(fmt(todayISO));

  // Only the current period (the one due next, including any archived days that
  // still count toward it) shows by default — the rest collapse behind a toggle
  // so this section doesn't dominate the screen on mobile.
  let currentHtml = "", otherHtml = "", otherCount = 0;
  for (let i = startBlock; i <= endBlock; i++){
    const { start, end, payday } = payPeriod(i);
    const card = payBracketCard(start, end, payday, allDays, knownDates, i === currentBlock);
    if (i === currentBlock) currentHtml += card;
    else { otherHtml += card; otherCount++; }
  }

  let html = currentHtml || otherHtml;
  if (otherCount > 0){
    html += `<details class="col-span-full group">
      <summary class="cursor-pointer list-none flex items-center gap-1.5 text-xs font-medium text-sage-600 hover:text-sage-700 select-none py-1">
        <span class="transition-transform group-open:rotate-90">▸</span> Show ${otherCount} more upcoming pay period${otherCount===1?'':'s'}
      </summary>
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 mt-3">${otherHtml}</div>
    </details>`;
  }
  html += `<div class="col-span-full text-[10px] text-stone-300 text-center pt-1">Estimates only · £${HOURLY_RATE.toFixed(2)}/hr · 1257L tax code, no student loan · paid every 4 weeks</div>`;
  return html;
}

function greeting(){
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}

function heroSection(data){
  const dateStr = new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  const synced = data.lastSync ? new Date(data.lastSync).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}) : "never";
  return `<div class="max-w-6xl mx-auto">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-xs text-sage-100">${dateStr}</p>
        <h1 class="text-2xl font-extrabold mt-0.5">${greeting()}, ${data.person}</h1>
        <p class="text-xs text-sage-200 mt-1">Synced ${synced}${data.lastError?` · ⚠ ${data.lastError}`:''}</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="refresh" class="flex items-center gap-1.5 text-xs font-medium text-white bg-white/15 hover:bg-white/25 rounded-full px-3.5 py-2 transition-colors">
          <span class="w-3.5 h-3.5">${ICONS.refresh}</span> Refresh
        </button>
        <button id="signOutBtn" class="text-xs font-medium text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full px-3 py-2 transition-colors">
          Sign out
        </button>
      </div>
    </div>
  </div>`;
}

// The next upcoming shift (today or later) across live + archive days, styled as
// a highlight card under the hero — like a "what's next" glance.
function nextShiftCard(data){
  const allDays = data.weeks.flatMap(w => w.days.map(d => ({...d, role: w.role})));
  const next = allDays
    .filter(d => d.date >= todayISO && (d.kind === "day" || d.kind === "night" || d.kind === "hol" || d.kind === "note") && d.hours > 0)
    .sort((a,b) => a.date.localeCompare(b.date))[0];

  const BORDER = { day: "border-amber-400", night: "border-indigo-400", hol: "border-emerald-400", note: "border-stone-400" };
  const BADGE = { day: "bg-amber-50 text-amber-800", night: "bg-indigo-50 text-indigo-800", hol: "bg-emerald-50 text-emerald-800", note: "bg-stone-100 text-stone-600" };
  const KIND_NAME = { day: "Day shift", night: "Night shift", hol: "Holiday", note: "Shift" };

  if (!next){
    return `<div class="rounded-2xl bg-white shadow-sm border border-stone-200 px-5 py-4 text-sm text-stone-400">No upcoming shifts scheduled yet.</div>`;
  }
  const isToday = next.date === todayISO;
  const dateLabel = isToday ? "Next shift today" : fmt(next.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});

  return `<div class="rounded-2xl bg-white shadow-sm border-l-4 ${BORDER[next.kind]} border-y border-r border-stone-200 px-5 py-4">
    <div class="text-xs text-stone-400 mb-1">${dateLabel}</div>
    <div class="flex items-center justify-between">
      <div class="text-lg font-bold text-stone-900">${next.label}</div>
      <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-1 rounded-full ${BADGE[next.kind]}"><span class="w-3 h-3">${KIND_ICON[next.kind]}</span>${KIND_NAME[next.kind]}</span>
    </div>
    <div class="text-xs text-stone-400 mt-1">${roleLabel(next.role)}${next.category ? ` · ${next.category}` : ''}</div>
  </div>`;
}

// Small summary strip at the top of the page.
function masterDetails(data){
  const curWeek = data.weeks.find(w => {
    const end = fmt(w.weekStart); end.setDate(end.getDate()+6);
    return todayISO >= w.weekStart && todayISO <= end.toLocaleDateString("en-CA");
  }) || data.weeks[0];
  const role = curWeek ? roleLabel(curWeek.role) : "—";
  const cycle = curWeek?.cycle || "—";

  const currentBlock = blockIndexFor(fmt(todayISO));
  const { payday } = payPeriod(currentBlock);
  const daysUntilPayday = Math.round((payday - fmt(todayISO)) / 86400000);
  const paydayStr = payday.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const todayStr = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

  return `<div class="rounded-2xl shadow-sm px-5 py-4 text-white bg-sage-600">
    <div class="text-xs font-medium text-white/80 mb-3">${todayStr}</div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div><div class="flex items-center gap-1 text-[10px] uppercase tracking-wide text-white/70"><span class="w-3 h-3">${ICONS.badge}</span>Role</div><div class="text-sm font-semibold mt-0.5">${role}</div></div>
      <div><div class="flex items-center gap-1 text-[10px] uppercase tracking-wide text-white/70"><span class="w-3 h-3">${ICONS.repeat}</span>Cycle</div><div class="text-sm font-semibold mt-0.5">${cycle}</div></div>
      <div><div class="flex items-center gap-1 text-[10px] uppercase tracking-wide text-white/70"><span class="w-3 h-3">${ICONS.calendar}</span>Next payday</div><div class="text-sm font-semibold mt-0.5">${paydayStr} <span class="text-white/70 font-normal">(${daysUntilPayday}d)</span></div></div>
      <div><div class="flex items-center gap-1 text-[10px] uppercase tracking-wide text-white/70"><span class="w-3 h-3">${ICONS.clock}</span>Contract</div><div class="text-sm font-semibold mt-0.5">${CONTRACT_HOURS_PER_WEEK}h/wk · £${HOURLY_RATE.toFixed(2)}/hr</div></div>
    </div>
    <button id="lockBtn" class="mt-3 text-[10px] text-white/60 hover:text-white/90 flex items-center gap-1"><span class="w-3 h-3">${ICONS.lock}</span>Lock</button>
  </div>`;
}

const DETAILS_PIN = "2326";
function isDetailsUnlocked(){ return sessionStorage.getItem("detailsUnlocked") === "1"; }

function lockedDetailsCard(){
  return `<div class="rounded-2xl shadow-sm px-5 py-6 text-white bg-sage-600 text-center">
    <div class="w-6 h-6 mx-auto mb-2 text-white/80">${ICONS.lock}</div>
    <div class="text-sm font-medium mb-3">Details locked</div>
    <form id="unlockForm" class="flex items-center justify-center gap-2">
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN" autocomplete="off"
        class="w-20 text-center rounded-lg px-2 py-1.5 text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-white/50" />
      <button type="submit" class="text-xs font-medium bg-white/20 hover:bg-white/30 rounded-full px-3 py-1.5 transition-colors">Unlock</button>
    </form>
    <div id="pinError" class="text-[11px] text-rose-100 mt-2 hidden">Wrong PIN</div>
  </div>`;
}

function renderMasterDetails(data){
  const unlocked = isDetailsUnlocked();
  document.getElementById("masterDetails").innerHTML = unlocked ? masterDetails(data) : lockedDetailsCard();
  document.getElementById("payCards").innerHTML = unlocked ? payCards(data.weeks, data.archiveDays || []) : "";

  const form = document.getElementById("unlockForm");
  if (form) form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (document.getElementById("pinInput").value === DETAILS_PIN){
      sessionStorage.setItem("detailsUnlocked", "1");
      renderMasterDetails(data);
    } else {
      document.getElementById("pinError").classList.remove("hidden");
    }
  });

  const lockBtn = document.getElementById("lockBtn");
  if (lockBtn) lockBtn.addEventListener("click", () => {
    sessionStorage.removeItem("detailsUnlocked");
    renderMasterDetails(data);
  });
}

async function load(){
  const r = await fetch("/api/shifts", { headers: await authHeader() }); const data = await r.json();
  document.getElementById("hero").innerHTML = heroSection(data);
  document.getElementById("nextShiftCard").innerHTML = nextShiftCard(data);
  renderMasterDetails(data);
  document.getElementById("weeks").innerHTML = data.weeks.map(weekCard).join("")
    || '<p class="text-stone-400 text-sm">No shifts yet — try Refresh.</p>';
}

// The refresh/sign-out buttons live inside dynamically-rendered #hero, so they're
// re-created on every load() — delegate clicks from a static ancestor instead.
document.getElementById("hero").addEventListener("click", async (e)=>{
  if (e.target.id === "signOutBtn"){ await signOut(auth); return; }
  if (e.target.id !== "refresh") return;
  e.target.textContent = "Refreshing…";
  try { await fetch("/api/sync",{method:"POST", headers: await authHeader()}); } catch(_){}
  await load();
});

document.getElementById("googleSignIn").addEventListener("click", async () => {
  document.getElementById("authError").classList.add("hidden");
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (e) {
    document.getElementById("authError").textContent = "Sign-in failed: " + e.message;
    document.getElementById("authError").classList.remove("hidden");
  }
});

onAuthStateChanged(auth, (user) => {
  document.getElementById("authGate").classList.toggle("hidden", !!user);
  document.getElementById("appRoot").classList.toggle("hidden", !user);
  if (user) load();
});
</script>
</body>
</html>
